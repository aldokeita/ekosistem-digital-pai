<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presenter · Ekosistem Digital</title>
<link rel="stylesheet" href="assets/css/tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--mist); color: var(--ink); font: 400 16px/1.5 var(--f-sans); display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

  header { display: flex; align-items: center; gap: 18px; padding: 12px 20px; background: var(--deeper); color: #fff; }
  .count { font: 600 22px/1 var(--f-mono); }
  .count small { color: var(--on-deep-2); font-size: 15px; }
  .who { font: 800 22px/1 var(--f-sans); background: var(--blue); padding: 8px 14px; border-radius: 10px; }
  .who.both { background: var(--sky); color: var(--night); }
  .nextwho { font: 600 15px/1.3 var(--f-sans); color: var(--sky); max-width: 260px; }
  .nextwho.hide { visibility: hidden; }
  .spacer { flex: 1; }
  .timer { display: flex; align-items: center; gap: 10px; }
  .timer .t { font: 700 30px/1 var(--f-mono); min-width: 110px; text-align: right; }
  .timer .d { font: 600 14px/1.2 var(--f-mono); color: var(--on-deep-2); min-width: 120px; }
  .timer .d.late { color: #FFB4BF; }
  .hbtn { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 8px; padding: 7px 12px; font-size: 14px; }
  .hbtn:hover { background: rgba(255,255,255,.18); }
  .clock { font: 500 15px/1 var(--f-mono); color: var(--on-deep-2); }
  .link { font: 600 13px/1.3 var(--f-sans); color: var(--on-deep-2); }
  .link.ok { color: #9FE2C3; }

  main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; padding: 16px; min-height: 0; }
  .left, .right { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .frame { position: relative; aspect-ratio: 16 / 9; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
  .frame .lab { position: absolute; left: 10px; top: 10px; z-index: 2; background: rgba(6,26,92,.85); color: #fff; font: 600 12px/1 var(--f-sans); padding: 6px 9px; border-radius: 6px; }
  .next { width: 62%; }
  .bar { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 12px; padding: 12px 16px; box-shadow: 0 0 0 1px var(--line); }
  .bar .title { font: 700 18px/1.2 var(--f-sans); flex: 1; min-width: 0; }
  .steps { font: 600 14px/1 var(--f-mono); color: var(--ink-3); white-space: nowrap; }
  .steps b { color: var(--blue); }
  .prog { height: 10px; background: var(--ice); border-radius: 5px; overflow: hidden; width: 220px; }
  .prog i { display: block; height: 100%; width: 0; background: var(--blue); transition: width .5s linear, background .3s; }
  .prog.over i { background: var(--over); }
  .slt { font: 600 14px/1 var(--f-mono); color: var(--ink-2); white-space: nowrap; min-width: 92px; text-align: right; }
  .slt.over { color: var(--over); }
  .ctrl { display: flex; gap: 10px; }
  .ctrl button { flex: 1; padding: 14px; border-radius: 10px; border: 0; background: var(--deep); color: #fff; font-weight: 700; font-size: 17px; }
  .ctrl button.sec { background: #fff; color: var(--deep); box-shadow: 0 0 0 2px var(--line-2) inset; flex: .5; }

  .notes { flex: 1; min-height: 0; overflow: auto; background: #fff; border-radius: 12px; box-shadow: 0 0 0 1px var(--line); padding: 18px 22px 26px; }
  .notes h3 { font: 700 12px/1.2 var(--f-sans); color: var(--blue); margin: 18px 0 6px; letter-spacing: .02em; }
  .notes h3:first-child { margin-top: 0; }
  .notes .script { font: 400 calc(19px * var(--fs, 1))/1.6 var(--f-sans); color: var(--ink); margin: 0; }
  .notes p { margin: 0; color: var(--ink-2); font-size: calc(15.5px * var(--fs, 1)); }
  .notes .warn { background: var(--mist); border-left: 4px solid var(--deep); padding: 10px 12px; border-radius: 6px; }
  .notes .tr { font-style: italic; }
  .fsz { display: flex; gap: 6px; margin-left: auto; }
  .fsz button { border: 0; background: var(--ice); color: var(--deep); border-radius: 6px; padding: 4px 9px; font-weight: 700; }
  .notice { display: none; background: #FFF4D6; color: #5A4200; padding: 10px 14px; border-radius: 10px; font-size: 14px; }
  .notice.on { display: block; }
  kbd { font: 600 12px/1 var(--f-mono); background: var(--ice); padding: 3px 6px; border-radius: 5px; }
</style>
</head>
<body>
<header>
  <span class="count" id="count">01 <small>/ 35</small></span>
  <span class="who" id="who">Aldo</span>
  <span class="nextwho hide" id="nextwho"></span>
  <span class="spacer"></span>
  <span class="link" id="link">Belum tersambung</span>
  <div class="timer">
    <span class="t" id="total">00:00</span>
    <span class="d" id="delta">rencana 00:00</span>
    <button class="hbtn" id="startBtn">Mulai</button>
    <button class="hbtn" id="resetBtn" title="Atur ulang timer">Ulang</button>
  </div>
  <span class="clock" id="clock"></span>
</header>
<main>
  <section class="left">
    <div class="notice" id="notice">Jendela ini belum tersambung ke presentasi. Buka <b>presentasi.html</b>, lalu tekan <kbd>P</kbd>. Sementara itu, jendela ini tetap bisa dipakai untuk latihan.</div>
    <div class="frame"><span class="lab">Sekarang</span><iframe id="cur" title="Slide sekarang" src="presentasi.html?mode=mirror"></iframe></div>
    <div class="bar">
      <span class="title" id="title"></span>
      <span class="steps" id="steps"></span>
      <div class="prog" id="prog"><i></i></div>
      <span class="slt" id="slt">0:00 / 0:00</span>
    </div>
    <div class="ctrl">
      <button class="sec" id="prevBtn">← Kembali</button>
      <button id="nextBtn">Lanjut →</button>
      <button class="sec" id="blackBtn">Layar hitam</button>
    </div>
  </section>
  <section class="right">
    <div class="frame next"><span class="lab" id="nextlab">Berikutnya</span><iframe id="nxt" title="Slide berikutnya" src="presentasi.html?mode=mirror"></iframe></div>
    <div class="notes" id="notes">
      <div class="fsz"><button id="fsMinus" title="Perkecil naskah">A−</button><button id="fsPlus" title="Perbesar naskah">A+</button></div>
    </div>
  </section>
</main>

<script src="assets/js/deck-data.js"></script>
<script src="assets/js/edits.js"></script>
<script src="assets/js/presenter.js"></script>
</body>
</html>
